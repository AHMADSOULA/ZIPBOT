
name: Unpack Cloud Bot ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE="Cloud-main_FlyIO_LOGS_UPDATE_WITH_UNPACKER.zip"

          unzip -o "$ZIP_FILE" -d extracted

          find extracted -name "main.py" -print

          BOT_DIR=$(dirname "$(find extracted -name "main.py" -print -quit)")

          if [ -z "$BOT_DIR" ]; then
            echo "main.py not found in ZIP"
            exit 1
          fi

          cp -a "$BOT_DIR"/. .

          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract Cloud Bot files" || echo "No changes"
          git push
