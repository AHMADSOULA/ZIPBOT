# fly.toml app configuration file generated for zipbot on 2026-10-30T14:39:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zipbot'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  HEADLESS = 'true'
  NAV_TIMEOUT = '120'
  PAGE_TIMEOUT = '60'

[processes]
  app = 'python main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
